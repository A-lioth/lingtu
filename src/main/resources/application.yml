server:
  port: 8080
  servlet:
    context-path: /api
spring:
  application:
    name: lingtu
  profiles:
    active: local
#  datasource:
#    url: jdbc:mysql://localhost:3306/lingtu?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
#    username: root
#    password: 39784560
#    driver-class-name: com.mysql.cj.jdbc.Driver
  # PostgreSQL 数据源配置（用于 PgVector）
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?sslmode=disable
    username: Alioth
    password: 39784560
    driver-class-name: org.postgresql.Driver
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:4b
      embedding:
        options:
          model: nomic-embed-text
    memory:
      repository:
        jdbc:
          initialize-schema: never
#     临时注释掉，便于大家开发调试和部署（实际需要启动 PgVector 数据库）
      vectorstore:
        pgvector:
          index-type: HNSW
          dimensions: 1536
          distance-type: COSINE_DISTANCE
          max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.alioth.lingtu.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: "Prodigal AI Travel 接口文档"
    version: v1.0
    description: "Prodigal AI 旅游助手接口文档"
    concat: Lang
    group:
      default:
        group-name: "local"
        api-rule: package
        api-rule-resources:
          - com.prodigal.travel.controller
